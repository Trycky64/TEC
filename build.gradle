plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // TEC is client-only, so only expose a client development run.
    runs {
        client {
            client()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ClientCommands uses mc_seed for Java's 48-bit LCG/Rand simulation.
    // Bundle it so TEC remains a standalone client mod.
    jarJar(implementation("com.seedfinding:mc_seed:${seedfinding_seed_version}")) {
        version {
            strictly "[${seedfinding_seed_version}]"
            prefer seedfinding_seed_version
        }
    }

    // NeoForge <= 1.21.8 does not automatically expose plain Java libraries
    // to development runs, so keep the same library on the runtime classpath.
    additionalRuntimeClasspath "com.seedfinding:mc_seed:${seedfinding_seed_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_credits             : mod_credits,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
